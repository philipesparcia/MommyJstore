<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Mommy J's Store | Premium Curated Essentials</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #2d241e;
            --accent: #b8924a;
            --bg-body: #fdfcfb;
            --white: #ffffff;
            --text-muted: #756d67;
            --border: rgba(45, 36, 30, 0.08);
            --shadow: 0 10px 30px rgba(0,0,0,0.04);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; scroll-behavior: smooth; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-body); color: var(--primary); line-height: 1.6; overflow-x: hidden; }

        /* Header & Navigation */
        .site-header {
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px);
            padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid var(--border);
        }
        .header-left { display: flex; align-items: center; gap: 40px; }
        .logo { display: flex; align-items: center; gap: 12px; font-family: 'Playfair Display', serif; font-size: 1.4rem; font-weight: 700; text-decoration: none; color: var(--primary); }
        .logo img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 1px solid var(--accent); }

        .nav-links { display: flex; gap: 25px; }
        .nav-links a { text-decoration: none; color: var(--primary); font-size: 0.9rem; font-weight: 600; transition: 0.3s; }
        .nav-links a:hover { color: var(--accent); }

        .cart-btn {
            background: var(--primary); color: var(--white); padding: 10px 22px; border-radius: 50px; border: none;
            display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 600;
        }
        .cart-count { background: var(--accent); color: var(--primary); padding: 2px 8px; border-radius: 20px; font-size: 0.75rem; font-weight: 800; }

        /* Hero */
        .hero { padding: 80px 5%; text-align: center; background: #f7f3f0; border-bottom: 1px solid var(--border); }
        .hero h1 { font-family: 'Playfair Display', serif; font-size: 3.2rem; margin-bottom: 0.5rem; }

        /* Search & Filters */
        .controls { padding: 3rem 5%; display: flex; flex-direction: column; align-items: center; gap: 1rem; }
        #product-search { width: 100%; max-width: 500px; padding: 15px 25px; border-radius: 50px; border: 1px solid var(--border); outline: none; box-shadow: var(--shadow); font-size: 1rem; }
        .filter-group { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
        .filter-btn { padding: 8px 18px; border-radius: 30px; border: 1px solid var(--border); background: var(--white); cursor: pointer; font-weight: 600; }
        .filter-btn.active { background: var(--primary); color: white; }

        /* Product Cards */
        .products-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2rem; padding: 2rem 5% 5rem; max-width: 1300px; margin: 0 auto; }
        .product-card { background: var(--white); border-radius: 15px; padding: 1.2rem; border: 1px solid var(--border); text-align: center; display: flex; flex-direction: column; justify-content: space-between; transition: var(--transition); }
        .product-card:hover { transform: translateY(-5px); box-shadow: var(--shadow); }
        .img-container { width: 100%; height: 250px; background: #f9f9f9; border-radius: 10px; margin-bottom: 1rem; overflow: hidden; }
        .product-card img { width: 100%; height: 100%; object-fit: cover; }
        .add-btn { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--primary); background: none; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .add-btn:hover { background: var(--primary); color: white; }

        /* About Section */
        .about-section { padding: 80px 10%; background: var(--white); border-top: 1px solid var(--border); text-align: center; }
        .about-content { max-width: 800px; margin: 0 auto; }

        /* Cart & Payment Buttons */
        #cart-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); visibility: hidden; opacity: 0; z-index: 1100; transition: 0.3s; }
        #cart-overlay.active { visibility: visible; opacity: 1; }
        #cart-modal { position: fixed; right: -400px; top: 0; width: 400px; height: 100%; background: white; z-index: 1200; transition: 0.4s; padding: 2rem; display: flex; flex-direction: column; box-shadow: -10px 0 30px rgba(0,0,0,0.1); }
        #cart-modal.open { right: 0; }
        .cart-item { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); align-items: center; }
        .cart-item img { width: 50px; height: 50px; border-radius: 5px; object-fit: cover; }
        
        .checkout-actions { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
        #maya-btn { background: #5d5fef; color: white; border: none; padding: 14px; border-radius: 12px; font-weight: 700; cursor: pointer; }

        .fly-img { position: fixed; z-index: 2000; pointer-events: none; border-radius: 10px; object-fit: cover; transition: all 0.7s ease-in-out; }
    </style>

    <script src="https://www.paypal.com/sdk/js?client-id=test&currency=USD"></script>
</head>
<body>

<header class="site-header">
    <div class="header-left">
        <a href="#home" class="logo">
            <img src="logo.png" alt="Logo" onerror="this.src='https://via.placeholder.com/50?text=MJ'">
            <span>Mommy J's</span>
        </a>
        <nav class="nav-links">
            <a href="#home">Home</a>
            <a href="#shop">Shop</a>
            <a href="#about">About</a>
        </nav>
    </div>
    <button class="cart-btn" id="open-cart">Bag <span class="cart-count" id="cart-count">0</span></button>
</header>

<section class="hero" id="home">
    <h1>Mommy J's Collection</h1>
    <p>Premium curated essentials for your home and lifestyle.</p>
</section>

<div class="controls" id="shop">
    <input type="text" id="product-search" placeholder="Search bags, shoes, or names...">
    <div class="filter-group">
        <button class="filter-btn active" data-category="all">All Items</button>
        <button class="filter-btn" data-category="bags">Bags</button>
        <button class="filter-btn" data-category="shoes">Shoes</button>
        <button class="filter-btn" data-category="watches">Watches</button>
        <button class="filter-btn" data-category="accessories">Accessories</button>
    </div>
</div>

<main class="products-container" id="grid"></main>

<section class="about-section" id="about">
    <div class="about-content">
        <h2>About Mommy J's</h2>
        <p>Quality daily essentials blending functionality with timeless style.</p>
    </div>
</section>

<div id="cart-overlay"></div>
<aside id="cart-modal">
    <h2 style="font-family: 'Playfair Display';">Your Bag</h2>
    <div id="cart-items" style="flex:1; overflow-y:auto; margin:1rem 0;"></div>
    <div style="font-weight:700; font-size: 1.2rem; margin-bottom: 1rem;">Total: $<span id="cart-total">0.00</span></div>
    
    <div class="checkout-actions">
        <div id="paypal-button-container"></div>
        <button id="maya-btn" onclick="alert('Redirecting to Maya...')">Pay with Maya / GCash</button>
    </div>
    
    <button id="close-cart" style="margin-top:20px; background:none; border:none; cursor:pointer; text-decoration:underline;">Close</button>
</aside>

<script>
    const PRODUCTS = [
        {id:'1', name:"Classic Leather Tote", price:45, cat:'bags', img:'https://images.unsplash.com/photo-1584917865442-de89df76afd3?auto=format&fit=crop&w=500&q=80'},
        {id:'2', name:"Minimalist Backpack", price:75, cat:'bags', img:'https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=500&q=80'},
        {id:'3', name:"Urban Sneakers", price:89, cat:'shoes', img:'https://images.unsplash.com/photo-1525966222134-fcfa99b8ae77?auto=format&fit=crop&w=500&q=80'},
        {id:'4', name:"Silver Mesh Watch", price:120, cat:'watches', img:'https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500&q=80'},
        {id:'5', name:"Cotton Essential Tee", price:25, cat:'accessories', img:'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=500&q=80'},
        {id:'6', name:"Gold Chronograph", price:150, cat:'watches', img:'https://images.unsplash.com/photo-1542496658-e33a6d0d50f6?auto=format&fit=crop&w=500&q=80'},
        {id:'7', name:"Leather Wallet", price:35, cat:'accessories', img:'https://images.unsplash.com/photo-1627123424574-724758594e93?auto=format&fit=crop&w=500&q=80'},
        {id:'8', name:"Designer Sunglasses", price:55, cat:'accessories', img:'https://images.unsplash.com/photo-1572635196237-14b3f281503f?auto=format&fit=crop&w=500&q=80'},
        {id:'9', name:"Suede Loafers", price:95, cat:'shoes', img:'https://images.unsplash.com/photo-1614252235316-8c857d38b5f4?auto=format&fit=crop&w=500&q=80'},
        {id:'10', name:"Canvas Messenger", price:40, cat:'bags', img:'https://images.unsplash.com/photo-1544816153-12ad5d714481?auto=format&fit=crop&w=500&q=80'}
    ];

    let cart = [];
    let currentCat = 'all';

    function renderProducts(items) {
        const grid = document.getElementById('grid');
        grid.innerHTML = items.map(p => `
            <div class="product-card">
                <div class="img-container"><img src="${p.img}"></div>
                <small style="color:var(--accent); text-transform:uppercase; font-weight:700;">${p.cat}</small>
                <h3 style="font-family:'Playfair Display'; margin:5px 0;">${p.name}</h3>
                <span class="price">$${p.price.toFixed(2)}</span>
                <button class="add-btn" onclick="addToCart('${p.id}', this)">Add to Bag</button>
            </div>
        `).join('');
    }

    function applyFilters() {
        const query = document.getElementById('product-search').value.toLowerCase();
        const filtered = PRODUCTS.filter(p => {
            const matchesSearch = p.name.toLowerCase().includes(query) || p.cat.toLowerCase().includes(query);
            const matchesCat = currentCat === 'all' || p.cat === currentCat;
            return matchesSearch && matchesCat;
        });
        renderProducts(filtered);
    }

    document.getElementById('product-search').addEventListener('input', applyFilters);

    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelector('.filter-btn.active').classList.remove('active');
            btn.classList.add('active');
            currentCat = btn.dataset.category;
            applyFilters();
        });
    });

    function addToCart(id, btn) {
        const product = PRODUCTS.find(p => p.id === id);
        cart.push(product);
        updateCartUI();
        flyAnimation(btn);
    }

    function updateCartUI() {
        const list = document.getElementById('cart-items');
        list.innerHTML = cart.map((item, idx) => `
            <div class="cart-item">
                <img src="${item.img}">
                <div style="flex:1"><b>${item.name}</b><br>$${item.price}</div>
                <button onclick="removeItem(${idx})" style="color:red; background:none; border:none; cursor:pointer;">&times;</button>
            </div>
        `).join('');
        const total = cart.reduce((sum, item) => sum + item.price, 0);
        document.getElementById('cart-total').innerText = total.toFixed(2);
        document.getElementById('cart-count').innerText = cart.length;
        
        initPaypal(total); // Re-init PayPal with new total
    }

    function removeItem(idx) { cart.splice(idx, 1); updateCartUI(); }

    function initPaypal(total) {
        document.getElementById('paypal-button-container').innerHTML = '';
        if (total <= 0) return;
        paypal.Buttons({
            createOrder: (data, actions) => {
                return actions.order.create({ purchase_units: [{ amount: { value: total.toFixed(2) } }] });
            }
        }).render('#paypal-button-container');
    }

    function flyAnimation(btn) {
        const img = btn.parentElement.querySelector('img');
        const flyImg = img.cloneNode();
        const rect = img.getBoundingClientRect();
        const target = document.getElementById('open-cart').getBoundingClientRect();
        Object.assign(flyImg.style, { position:'fixed', left:rect.left+'px', top:rect.top+'px', width:rect.width+'px', height:rect.height+'px' });
        flyImg.className = 'fly-img';
        document.body.appendChild(flyImg);
        setTimeout(() => { Object.assign(flyImg.style, { left:target.left+'px', top:target.top+'px', width:'20px', height:'20px', opacity:'0' }); }, 50);
        setTimeout(() => flyImg.remove(), 750);
    }

    document.getElementById('open-cart').onclick = () => { document.getElementById('cart-modal').classList.add('open'); document.getElementById('cart-overlay').classList.add('active'); };
    document.getElementById('close-cart').onclick = document.getElementById('cart-overlay').onclick = () => { document.getElementById('cart-modal').classList.remove('open'); document.getElementById('cart-overlay').classList.remove('active'); };

    renderProducts(PRODUCTS);
</script>
</body>
</html>
